[package]
name = "typst-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
typst = "0.15.1"
typst-ide = "0.15.1"
typst-library = "0.15.1"
typst-macros = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-timing = "0.15.1"

typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"
typst-utils = "0.15.1"

comemo = "^0"
unscanny = "^0.1"

tylax = { version = "^0.2", features = [] }

wasm-bindgen = "^0.2"
wasm-bindgen-futures = "^0.4"
js-sys = "^0.3"
serde = "^1.0"
serde-wasm-bindgen = "^0.6"
tsify = "^0.5"
console_error_panic_hook = "^0.1"

rayon = "^1.11"
rustc-hash = "^2.1"

chrono = "^0.4"
send_wrapper = "^0.6"

serde_json = "^1"
unicode_names2 = "^2"
unicode-math-class = "^0.1"

[patch.crates-io]
typst = { path = "../typst/crates/typst" }
typst-ide = { path = "../typst/crates/typst-ide" }
typst-svg = { path = "../typst/crates/typst-svg" }
typst-pdf = { path = "../typst/crates/typst-pdf" }
typst-library = { path = "../typst/crates/typst-library" }
typst-macros = { path = "../typst/crates/typst-macros" }
typst-timing = { path = "../typst/crates/typst-timing" }
typst-render = { path = "../typst/crates/typst-render" }
typst-layout = { path = "../typst/crates/typst-layout" }
typst-utils = { path = "../typst/crates/typst-utils" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"

[[bin]]
name = "symbol"
path = "src/tools/symbol.rs"
